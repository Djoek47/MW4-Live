<!doctype html><html><head><meta charset="utf-8"><title>MW4 Card</title>
<link rel="stylesheet" href="base.css">
<style>
/* Full-screen poster cards: card.html?type=starting | brb | ending | schedule.  Everything on the centre line. */
.wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ribbon{background:var(--paper);color:var(--red);font-size:34px;font-weight:800;letter-spacing:.28em;padding:10px 70px 8px;
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.row{display:flex;align-items:center;gap:40px}
.row .star{font-size:90px}
h1{font-size:200px;line-height:.84;font-weight:800;color:var(--paper);text-shadow:8px 8px 0 var(--red-d)}
h1 span{color:var(--amber)}
.sub{font-size:40px;color:var(--paper);margin-top:30px;font-weight:600;letter-spacing:.06em}
.count{font-size:120px;margin-top:20px;color:var(--ink);background:var(--paper);padding:6px 40px 0;border:6px solid var(--ink);box-shadow:10px 10px 0 var(--red-d)}
.top{position:absolute;top:50px;left:0;right:0;display:flex;justify-content:center;z-index:2}
.top .bug{transform:scale(1.5)}
.foot{position:absolute;bottom:0;left:0;right:0;z-index:2;height:64px;background:var(--ink);display:flex;justify-content:space-between;align-items:center;padding:0 60px;font-size:26px;color:var(--mute);border-top:5px solid var(--amber)}
.board{margin-top:34px;background:var(--paper);color:var(--ink);border:6px solid var(--ink);box-shadow:12px 12px 0 var(--red-d);width:1100px;padding:10px 0}
.board .r{display:grid;grid-template-columns:130px 1fr 150px;align-items:center;padding:9px 40px;font-size:38px;font-weight:800;border-bottom:2px solid #d8c69c;text-align:left}
.board .r:last-child{border:0}
.board .r .t{font-family:'JetBrains Mono';font-size:28px;font-weight:500}
.board .r.on{background:var(--red);color:var(--paper)}
.board .tag{justify-self:end}
</style></head><body>
<div class="full"></div><div class="scan"></div>
<div class="top"><div id="bug"></div></div>
<div class="wrap" id="wrap"></div>
<div class="foot"><span id="handle"></span><span>★ THE PEOPLE'S BROADCAST · FAN-RUN PARODY · NOT AFFILIATED WITH ACTIVISION ★</span><span class="mono" id="clock"></span></div>
<script src="../config.js"></script><script src="base.js"></script>
<script>
const q = new URLSearchParams(location.search), type = q.get("type") || "starting";
$("#bug").innerHTML = bug(); $("#handle").textContent = M.handle; clock($("#clock"));
const s = slots(), nxt = s.next[0];
const C = {
  starting: ["BROADCAST BEGINS SOON", `THE PEOPLE'S<br>BROADCAST`, M.nowShow],
  brb: ["THE MINISTRY WILL RETURN", `BE RIGHT<br><span>BACK</span>`, `Remain at your post · ${nxt.time} ET: ${nxt.show}`],
  ending: ["BROADCAST COMPLETE", `GLORY TO<br><span>THE CLUTCH</span>`, `Next: ${nxt.time} ET ${nxt.show} · the channel stays on 24/7`],
  schedule: ["TODAY'S FIVE-SHOW PLAN", "", "All times Eastern"],
}[type];
const head = `<div class="ribbon">${C[0]}</div>`;
if (type === "schedule") {
  $("#wrap").innerHTML = head + `<div class="board">` + M.schedule.map(r =>
    `<div class="r ${r === s.current ? "on" : ""}"><span class="t">${r.time}</span><span>${r.show}</span><span class="tag ${r.type}">${r.type}</span></div>`).join("") + `</div>`;
} else {
  $("#wrap").innerHTML = head + `<div class="row" style="margin-top:34px"><span class="star"></span><h1>${C[1]}</h1><span class="star"></span></div><div class="sub">${C[2]}</div>`
    + (type === "starting" ? `<div class="count mono" id="cd"></div>` : "");
}
if (type === "starting") {
  const end = Date.now() + (Number(q.get("min")) || 5) * 60000;
  const f = () => { const d = Math.max(0, end - Date.now()); $("#cd").textContent = String(Math.floor(d / 60000)).padStart(2, "0") + ":" + String(Math.floor(d / 1000) % 60).padStart(2, "0"); };
  f(); setInterval(f, 500);
}
</script></body></html>
